<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ffd9ec"/>
      <stop offset="55%" stop-color="#ff8fc7"/>
      <stop offset="100%" stop-color="#c2007a"/>
    </radialGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3fa0"/>
      <stop offset="100%" stop-color="#7a0048"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d989"/>
      <stop offset="50%" stop-color="#caa03a"/>
      <stop offset="100%" stop-color="#f6d989"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- glitter sparkles -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="60" cy="90" r="3.5"/>
      <circle cx="120" cy="50" r="2.2"/>
      <circle cx="430" cy="70" r="3"/>
      <circle cx="470" cy="140" r="2.5"/>
      <circle cx="40" cy="220" r="2.6"/>
      <circle cx="90" cy="330" r="2.2"/>
      <circle cx="60" cy="420" r="3.2"/>
      <circle cx="440" cy="330" r="3.4"/>
      <circle cx="470" cy="420" r="2.4"/>
      <circle cx="410" cy="460" r="2.8"/>
      <circle cx="150" cy="460" r="2.2"/>
      <circle cx="260" cy="60" r="2.6"/>
      <circle cx="330" cy="440" r="2.2"/>
    </g>
    <g fill="#ffffff" opacity="0.5">
      <circle cx="200" cy="40" r="1.6"/>
      <circle cx="380" cy="200" r="1.8"/>
      <circle cx="30" cy="150" r="1.5"/>
      <circle cx="480" cy="260" r="1.6"/>
      <circle cx="120" cy="480" r="1.5"/>
      <circle cx="350" cy="30" r="1.4"/>
    </g>

    <!-- "15" -->
    <text x="256" y="300" text-anchor="middle"
          font-family="DejaVu Serif, Georgia, serif" font-weight="bold"
          font-size="240" fill="url(#numGrad)">15</text>

    <!-- "anos" -->
    <text x="256" y="380" text-anchor="middle"
          font-family="Liberation Serif, Georgia, serif" font-style="italic" font-weight="bold"
          font-size="72" fill="url(#goldGrad)">anos</text>
  </g>
</svg>
